<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>協会LP パターンC｜実画像プレビュー</title>
<style>
  :root{ --bg:#f5f7f6; --fg:#4a5550; --mint:#7FD4B5; --pale:#EAF7F1; --deep:#1E7A5F; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161a18; --fg:#9fb0a8; } }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 12px 60px; }
  .note{ font-size:12px; letter-spacing:.08em; text-align:center; line-height:1.7; }
  .note strong{ letter-spacing:.14em; }
  .phone{
    width:100%; max-width:480px; background:#fff; border-radius:8px; overflow:hidden;
    box-shadow:0 12px 40px rgba(20,33,29,.25);
  }
  .phone img{ display:block; width:100%; height:auto; }
  .photo-slot{
    margin:0; padding:34px 22px; background:var(--pale); text-align:center;
  }
  .photo-slot .frame{
    border:2px dashed var(--mint); border-radius:14px; background:#fff;
    padding:34px 16px; color:var(--deep); font-size:12.5px; font-weight:700; line-height:2.0;
  }
  .photo-slot .cap{ margin:10px 0 0; font-size:11px; color:#4a5550; letter-spacing:.05em; }
</style>

<div class="stage">
  <p class="note"><strong>全国マーケティング支援協会 LP パターンC</strong><br>
  実画像プレビュー（GPT Image 2生成・全11セクション）</p>

  <div class="phone">
    <img src="img/01_fv.png" alt="ファーストビュー：誠実さが、正しく報われる業界へ">
    <img src="img/02_problem.png" alt="この業界、おかしくないですか">
    <img src="img/03_beforeafter.png" alt="誠実な人が、損をしていい理由はない">
    <img src="img/04_daihyo.png" alt="代表ストーリー">
    <img src="img/05_values.png" alt="私たちが、大切にしていること">
    <img src="img/06_activities.png" alt="毎月、全国で動いています">

    <div class="photo-slot">
      <div class="frame">
        実写セクション「全国各地で、志ある仲間が集まっています」<br>
        勉強会・交流会の写真をここに配置（AI生成しない）
      </div>
      <p class="cap">※会員の掲載許諾を取得後に差し込み</p>
    </div>

    <img src="img/07_sme.png" alt="私たちが本当に守りたいのは、その先の中小企業">
    <img src="img/08_fit.png" alt="一緒に業界を変えたいのは、こんな方">
    <img src="img/09_faq.png" alt="よくあるご質問">
    <img src="img/10_apply.png" alt="入会までの流れ">
    <img src="img/11_closing.png" alt="誠実さが、正しく報われる業界へ">
  </div>

  <p class="note">c04の空枠には代表の実写を後入れ／年会費・推薦制度等の表記は掲載前に要確認</p>
</div>
